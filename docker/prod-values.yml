ingress:
  enabled: true
  tls:
    handshake:
      secretName: handshake.axdd.s.uw.edu-ingress-cert
      hosts:
        - handshake.axdd.s.uw.edu
  hosts:
    handshake:
      host: handshake.axdd.s.uw.edu
      paths:
        - "/"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/client-body-buffer-size: "16K"
    nginx.ingress.kubernetes.io/proxy-body-size: "20M"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
targetAverageUtilization: 100
lifecycle:
  enabled: true
  preStop:
    enabled: true
affinity:
   podsSpanNodes: true
readiness:
  enabled: true
securityPolicy:
  enabled: false

repo: handshake-provisioner
instance: prod
namespace:
  enabled: true

externalService:
  enabled: true
  name: handshake-db-service
  type: ClusterIP
  serviceAddress: 172.18.1.73
  servicePort: 5432
database:
  engine: postgres
  name: handshake-prod
  hostname: handshake-db-service
  secretName: handshake.axdd.s.uw.edu-sql-secrets

memcached:
  enabled: true
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate

cronjob:
  enabled: true
  jobs:
    - name: create-handshake-file
      schedule: "1 9 * * 1,4"
      command: ["/scripts/management_command.sh"]
      args: ["create_handshake_file", "current"]
    - name: create-uconnect-file
      schedule: "1 9 * * 5"
      command: ["/scripts/management_command.sh"]
      args: ["create_uconnect_file", "current"]
    - name: build-file
      schedule: "*/10 0,1,9,15-23 * * 1-5"
      command: ["/scripts/management_command.sh"]
      args: ["build_file"]
      resources:
        limits:
          cpu: 500m
          memory: 1024Mi
        requests:
          cpu: 250m
          memory: 768Mi

gcsCredentials:
  mounted: true
  secretName: handshake.axdd.s.uw.edu-gcs-credentials

environmentVariables:
  - name: ENV
    value: prod

  - name: SWS_ENV
    value: PROD

  - name: AUTH
    value: SAML
  - name: SAML_ENTITY_ID
    value: https://handshake.axdd.s.uw.edu/saml2
  - name: CLUSTER_CNAME
    value: handshake.axdd.s.uw.edu

  - name: UW_PERSON_DB_HOST
    value: 172.18.1.67

  - name: UW_PERSON_DB_NAME
    value: uw-person-prod

  - name: FILENAME_TEST_PREFIX
    value: TEST

externalSecrets:
  enabled: true
  secrets:
    - name: handshake.axdd.s.uw.edu-secrets
      externalKey: handshake/prod/secrets
      data:
        - name: django-secret
          property: django-secret
        - name: storage-bucket-name
          property: storage-bucket-name
    - name: handshake.axdd.s.uw.edu-handshake-aws-secrets
      externalKey: handshake/prod/handshake-aws-secrets
      data:
        - name: access-key-id
          property: access-key-id
        - name: secret-access-key
          property: secret-access-key
        - name: storage-bucket-name
          property: storage-bucket-name
        - name: storage-bucket-path
          property: storage-bucket-path
        - name: s3-region-name
          property: s3-region-name
    - name: handshake.axdd.s.uw.edu-uconnect-aws-secrets
      externalKey: handshake/prod/uconnect-aws-secrets
      data:
        - name: access-key-id
          property: access-key-id
        - name: secret-access-key
          property: secret-access-key
        - name: storage-bucket-name
          property: storage-bucket-name
        - name: storage-bucket-path
          property: storage-bucket-path
        - name: s3-region-name
          property: s3-region-name
    - name: handshake.axdd.s.uw.edu-sql-secrets
      externalKey: handshake/shared/sql-secrets
      data:
        - name: username
          property: username
        - name: password
          property: password
    - name: handshake.axdd.s.uw.edu-shared-secrets
      externalKey: handshake/shared/secrets
      data:
        - name: storage-project-id
          property: storage-project-id
        - name: person-db-user
          property: person-db-user
        - name: person-db-pass
          property: person-db-pass
        - name: sws-token
          property: sws-token
    - name: handshake.axdd.s.uw.edu-gcs-credentials
      externalKey: handshake/shared/gcs-credentials
      data:
        - name: credentials.json
          property: credentials.json
    - name: handshake.axdd.s.uw.edu-uw-idp-cert
      externalKey: idp-cert
      data:
        - name: uw-idp-cert
          property: cert

environmentVariablesSecrets:
  djangoSecret:
    name: DJANGO_SECRET
    secretName: handshake.axdd.s.uw.edu-secrets
    secretKey: django-secret
  storageBucketName:
    name: STORAGE_BUCKET_NAME
    secretName: handshake.axdd.s.uw.edu-secrets
    secretKey: storage-bucket-name
  storageProjectId:
    name: STORAGE_PROJECT_ID
    secretName: handshake.axdd.s.uw.edu-shared-secrets
    secretKey: storage-project-id
  handshakeAwsStorageBucketName:
    name: HANDSHAKE_AWS_STORAGE_BUCKET_NAME
    secretName: handshake.axdd.s.uw.edu-handshake-aws-secrets
    secretKey: storage-bucket-name
  handshakeAwsStorageBucketPath:
    name: HANDSHAKE_AWS_LOCATION
    secretName: handshake.axdd.s.uw.edu-handshake-aws-secrets
    secretKey: storage-bucket-path
  handshakeAwsAccessKeyID:
    name: HANDSHAKE_AWS_ACCESS_KEY_ID
    secretName: handshake.axdd.s.uw.edu-handshake-aws-secrets
    secretKey: access-key-id
  handshakeAwsSecretAccessKey:
    name: HANDSHAKE_AWS_SECRET_ACCESS_KEY
    secretName: handshake.axdd.s.uw.edu-handshake-aws-secrets
    secretKey: secret-access-key
  handshakeAwsS3RegionName:
    name: HANDSHAKE_AWS_S3_REGION_NAME
    secretName: handshake.axdd.s.uw.edu-handshake-aws-secrets
    secretKey: s3-region-name
  uconnectAwsStorageBucketName:
    name: UCONNECT_AWS_STORAGE_BUCKET_NAME
    secretName: handshake.axdd.s.uw.edu-uconnect-aws-secrets
    secretKey: storage-bucket-name
  uconnectAwsStorageBucketPath:
    name: UCONNECT_AWS_LOCATION
    secretName: handshake.axdd.s.uw.edu-uconnect-aws-secrets
    secretKey: storage-bucket-path
  uconnectAwsAccessKeyID:
    name: UCONNECT_AWS_ACCESS_KEY_ID
    secretName: handshake.axdd.s.uw.edu-uconnect-aws-secrets
    secretKey: access-key-id
  uconnectAwsSecretAccessKey:
    name: UCONNECT_AWS_SECRET_ACCESS_KEY
    secretName: handshake.axdd.s.uw.edu-uconnect-aws-secrets
    secretKey: secret-access-key
  uconnectAwsS3RegionName:
    name: UCONNECT_AWS_S3_REGION_NAME
    secretName: handshake.axdd.s.uw.edu-uconnect-aws-secrets
    secretKey: s3-region-name
  personDBUser:
    name: UW_PERSON_DB_USER
    secretName: handshake.axdd.s.uw.edu-shared-secrets
    secretKey: person-db-user
  personDBPass:
    name: UW_PERSON_DB_PASSWORD
    secretName: handshake.axdd.s.uw.edu-shared-secrets
    secretKey: person-db-pass
  swsToken:
    name: RESTCLIENTS_SWS_OAUTH_BEARER
    secretName: handshake.axdd.s.uw.edu-shared-secrets
    secretKey: sws-token
  samlIDPCert:
    name: IDP_CERT
    secretName: handshake.axdd.s.uw.edu-uw-idp-cert
    secretKey: uw-idp-cert
